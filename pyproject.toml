[project]
name = "data-analysis-portfolio-release-tools"
version = "0.1.0"
description = "Validation tools for the clean-room public portfolio release"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "playwright==1.61.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "FURB", "I", "PL", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
